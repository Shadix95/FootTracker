services:
  postgres:
    image: postgres:17
    container_name: foottracker-postgres
    environment:
      POSTGRES_DB: foottracker
      POSTGRES_USER: foottracker
      POSTGRES_PASSWORD: foottracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:5
    container_name: foottracker-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
