services:
  postgres:
    image: postgres:17
    container_name: foottracker-postgres
    environment:
      POSTGRES_DB: foottracker
      POSTGRES_USER: foottracker
      POSTGRES_PASSWORD: foottracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
