spring.application.name=footTracker

football-data.base-url=https://api.football-data.org/v4
football-data.api-token=${FOOTBALL_DATA_TOKEN:}
football-data.competitions=PL,FL1
football-data.sync-interval=PT30M

spring.datasource.url=jdbc:h2:file:./data/foottracker
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

spring.cache.cache-names=standings,matches,scorers
spring.cache.caffeine.spec=expireAfterWrite=5m
